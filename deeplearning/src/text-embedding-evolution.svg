<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969DA"/>
    </marker>
  </defs>
  <!-- node template: box + title + sub -->
  <g>
    <rect x="10" y="55" width="185" height="86" rx="12" fill="#EDF1F7" stroke="#D9DEE7"/>
    <text x="102" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2430">One-hot</text>
    <text x="102" y="112" text-anchor="middle" font-size="12.5" fill="#6B7383">稀疏 · 维度=词表大小</text>
    <text x="102" y="130" text-anchor="middle" font-size="12.5" fill="#6B7383">只记「是谁」无语义</text>
  </g>
  <g>
    <rect x="248" y="55" width="185" height="86" rx="12" fill="#EEF4FC" stroke="#DCE9F9"/>
    <text x="340" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#05468F">Word2Vec</text>
    <text x="340" y="112" text-anchor="middle" font-size="12.5" fill="#3D4454">静态词向量 · 查表即得</text>
    <text x="340" y="130" text-anchor="middle" font-size="12.5" fill="#3D4454">学「和谁常一起出现」</text>
  </g>
  <g>
    <rect x="486" y="55" width="185" height="86" rx="12" fill="#F3EDFC" stroke="#E2D6F5"/>
    <text x="578" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#6639BA">Transformer</text>
    <text x="578" y="112" text-anchor="middle" font-size="12.5" fill="#3D4454">上下文动态向量</text>
    <text x="578" y="130" text-anchor="middle" font-size="12.5" fill="#3D4454">一词多义随语境变化</text>
  </g>
  <g>
    <rect x="724" y="55" width="186" height="86" rx="12" fill="#E7F6F9" stroke="#C9E9F0"/>
    <text x="817" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#0A6E7C">BGE</text>
    <text x="817" y="112" text-anchor="middle" font-size="12.5" fill="#3D4454">句子级嵌入 · 1024 维</text>
    <text x="817" y="130" text-anchor="middle" font-size="12.5" fill="#3D4454">学「和谁语义相关」</text>
  </g>
  <!-- arrows -->
  <line x1="195" y1="98" x2="242" y2="98" stroke="#0969DA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="433" y1="98" x2="480" y2="98" stroke="#0969DA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="671" y1="98" x2="718" y2="98" stroke="#0969DA" stroke-width="2" marker-end="url(#arr)"/>
  <!-- top labels -->
  <text x="102" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#9AA2B1">1986~</text>
  <text x="340" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#9AA2B1">2013</text>
  <text x="578" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#9AA2B1">2018~</text>
  <text x="817" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#9AA2B1">2023~</text>
  <!-- bottom arrow -->
  <text x="460" y="178" text-anchor="middle" font-size="13" fill="#6B7383">向量越来越「稠密」、语义越来越「听得懂」、粒度从「词」走到「句/篇」</text>
  <line x1="110" y1="165" x2="810" y2="165" stroke="#D9DEE7" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
