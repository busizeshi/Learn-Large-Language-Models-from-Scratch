<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969DA"/>
    </marker>
    <marker id="arr2v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250DF"/>
    </marker>
  </defs>

  <!-- ============ LEFT: CBOW ============ -->
  <rect x="8" y="6" width="436" height="318" rx="14" fill="#F6F8FB" stroke="#D9DEE7"/>
  <text x="226" y="34" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F2430">CBOW：上下文 → 中心词</text>
  <text x="226" y="54" text-anchor="middle" font-size="12" fill="#6B7383">例句：今天 / 天气 / 很 / 好　（预测「很」）</text>

  <!-- context words -->
  <rect x="52" y="72" width="86" height="30" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
  <text x="95" y="92" text-anchor="middle" font-size="13" fill="#05468F">今天</text>
  <rect x="183" y="72" width="86" height="30" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
  <text x="226" y="92" text-anchor="middle" font-size="13" fill="#05468F">天气</text>
  <rect x="314" y="72" width="86" height="30" rx="8" fill="#FFFFFF" stroke="#0969DA"/>
  <text x="357" y="92" text-anchor="middle" font-size="13" fill="#05468F">好</text>
  <text x="440" y="92" font-size="11" fill="#9AA2B1">上下文词</text>

  <line x1="95" y1="102" x2="180" y2="140" stroke="#0969DA" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="226" y1="102" x2="226" y2="140" stroke="#0969DA" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="357" y1="102" x2="272" y2="140" stroke="#0969DA" stroke-width="1.6" marker-end="url(#arr2)"/>

  <rect x="118" y="142" width="216" height="30" rx="8" fill="#EEF4FC" stroke="#DCE9F9"/>
  <text x="226" y="162" text-anchor="middle" font-size="12.5" fill="#05468F">输入矩阵 W 查表 → 各得 1×N 向量</text>

  <line x1="226" y1="172" x2="226" y2="196" stroke="#0969DA" stroke-width="1.6" marker-end="url(#arr2)"/>

  <rect x="118" y="198" width="216" height="30" rx="8" fill="#EEF4FC" stroke="#DCE9F9"/>
  <text x="226" y="218" text-anchor="middle" font-size="12.5" fill="#05468F">求平均 → 隐层 h</text>

  <line x1="226" y1="228" x2="226" y2="252" stroke="#0969DA" stroke-width="1.6" marker-end="url(#arr2)"/>

  <rect x="118" y="254" width="216" height="30" rx="8" fill="#EEF4FC" stroke="#DCE9F9"/>
  <text x="226" y="274" text-anchor="middle" font-size="12.5" fill="#05468F">W′ 打分 + softmax</text>

  <line x1="226" y1="284" x2="226" y2="300" stroke="#0969DA" stroke-width="1.6" marker-end="url(#arr2)"/>

  <text x="226" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1A7F37">预测中心词「很」 ✓</text>

  <!-- ============ RIGHT: Skip-gram ============ -->
  <rect x="476" y="6" width="436" height="318" rx="14" fill="#F6F8FB" stroke="#D9DEE7"/>
  <text x="694" y="34" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F2430">Skip-gram：中心词 → 上下文</text>
  <text x="694" y="54" text-anchor="middle" font-size="12" fill="#6B7383">用「很」去预测它左右窗口里的每个词</text>

  <rect x="651" y="72" width="86" height="30" rx="8" fill="#FFFFFF" stroke="#8250DF"/>
  <text x="694" y="92" text-anchor="middle" font-size="13" fill="#6639BA">很（中心词）</text>

  <line x1="694" y1="102" x2="694" y2="140" stroke="#8250DF" stroke-width="1.6" marker-end="url(#arr2v)"/>

  <rect x="586" y="142" width="216" height="30" rx="8" fill="#F3EDFC" stroke="#E2D6F5"/>
  <text x="694" y="162" text-anchor="middle" font-size="12.5" fill="#6639BA">W 查表 → h（1×N 向量）</text>

  <line x1="694" y1="172" x2="694" y2="196" stroke="#8250DF" stroke-width="1.6" marker-end="url(#arr2v)"/>

  <rect x="586" y="198" width="216" height="30" rx="8" fill="#F3EDFC" stroke="#E2D6F5"/>
  <text x="694" y="218" text-anchor="middle" font-size="12.5" fill="#6639BA">W′ 打分 + softmax（同左侧结构）</text>

  <line x1="640" y1="228" x2="576" y2="258" stroke="#8250DF" stroke-width="1.4" marker-end="url(#arr2v)"/>
  <line x1="672" y1="228" x2="650" y2="258" stroke="#8250DF" stroke-width="1.4" marker-end="url(#arr2v)"/>
  <line x1="716" y1="228" x2="738" y2="258" stroke="#8250DF" stroke-width="1.4" marker-end="url(#arr2v)"/>
  <line x1="748" y1="228" x2="812" y2="258" stroke="#8250DF" stroke-width="1.4" marker-end="url(#arr2v)"/>

  <rect x="522" y="260" width="86" height="30" rx="8" fill="#FFFFFF" stroke="#8250DF"/>
  <text x="565" y="280" text-anchor="middle" font-size="13" fill="#6639BA">今天</text>
  <rect x="624" y="260" width="86" height="30" rx="8" fill="#FFFFFF" stroke="#8250DF"/>
  <text x="667" y="280" text-anchor="middle" font-size="13" fill="#6639BA">天气</text>
  <rect x="726" y="260" width="86" height="30" rx="8" fill="#FFFFFF" stroke="#8250DF"/>
  <text x="769" y="280" text-anchor="middle" font-size="13" fill="#6639BA">好</text>
  <text x="824" y="280" font-size="11" fill="#9AA2B1">…每个都是正样本</text>

  <text x="694" y="316" text-anchor="middle" font-size="12.5" fill="#9A6700">每个词还要配 k 个「负样本」一起做二分类 → 见下文</text>
</svg>
