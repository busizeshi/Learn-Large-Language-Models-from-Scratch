<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24,0 L0,0 0,24" fill="none" stroke="#1f6f8b" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="940" height="540" fill="#faf7f0"/>
  <rect width="940" height="540" fill="url(#grid2)"/>

  <text x="30" y="34" font-size="21" font-weight="700" fill="#22333f">位置编码家族图谱</text>
  <text x="30" y="55" font-size="12.5" fill="#7c6f64">按「把位置信息放在哪里」分类：先给绝对坐标，还是直接建模相对关系，或者干脆不加</text>

  <!-- 根节点 -->
  <rect x="370" y="70" width="200" height="42" rx="10" fill="#22333f"/>
  <text x="470" y="97" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">位置编码</text>

  <!-- 分叉连线 -->
  <polyline points="470,112 470,124 230,124 230,140" fill="none" stroke="#1f6f8b" stroke-width="1.8"/>
  <polyline points="470,112 470,124 710,124 710,140" fill="none" stroke="#1f6f8b" stroke-width="1.8"/>

  <!-- 绝对分支 -->
  <rect x="60" y="144" width="340" height="52" rx="10" fill="#1f6f8b"/>
  <text x="230" y="167" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">绝对位置编码 APE</text>
  <text x="230" y="186" font-size="11" fill="#dceaf1" text-anchor="middle">每个位置一个专属向量：先有位置，再算注意力</text>

  <polyline points="230,196 230,210" fill="none" stroke="#1f6f8b" stroke-width="1.6"/>
  <rect x="60" y="212" width="340" height="66" rx="9" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.3"/>
  <text x="74" y="234" font-size="12.5" font-weight="700" fill="#22333f">训练式：nn.Embedding(max_len, d)</text>
  <text x="74" y="252" font-size="11" fill="#5a504a">BERT · GPT —— 表达力最强，但长度固定、</text>
  <text x="74" y="268" font-size="11" fill="#5a504a">要额外训练，外推到更长序列会崩</text>

  <polyline points="230,278 230,292" fill="none" stroke="#1f6f8b" stroke-width="1.6"/>
  <rect x="60" y="294" width="340" height="66" rx="9" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.3"/>
  <text x="74" y="316" font-size="12.5" font-weight="700" fill="#22333f">三角式：正弦位置编码（本笔记主角）</text>
  <text x="74" y="334" font-size="11" fill="#5a504a">原版 Transformer —— 免训练、有界、平滑、</text>
  <text x="74" y="350" font-size="11" fill="#5a504a">天然编码相对位置（旋转可达）</text>

  <polyline points="230,360 230,374" fill="none" stroke="#1f6f8b" stroke-width="1.6"/>
  <rect x="60" y="376" width="340" height="66" rx="9" fill="#f2ede4" stroke="#8a7f70" stroke-width="1.2"/>
  <text x="74" y="398" font-size="12.5" font-weight="700" fill="#22333f">SHAPE（前沿）：按内容自适应平移</text>
  <text x="74" y="416" font-size="11" fill="#5a504a">给绝对编码加一个内容相关的偏移，</text>
  <text x="74" y="432" font-size="11" fill="#5a504a">让"同一个词在不同上下文"拿到的位置更合理</text>

  <!-- 相对分支 -->
  <rect x="510" y="144" width="400" height="52" rx="10" fill="#2e7d5b"/>
  <text x="710" y="167" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">相对位置编码 RPE</text>
  <text x="710" y="186" font-size="11" fill="#dcefe6" text-anchor="middle">不问"你在哪"，只问"你们相隔多远、谁在前"</text>

  <polyline points="610,196 610,210" fill="none" stroke="#2e7d5b" stroke-width="1.6"/>
  <polyline points="810,196 810,210" fill="none" stroke="#2e7d5b" stroke-width="1.6"/>

  <!-- 偏置方案列 -->
  <rect x="510" y="212" width="190" height="30" rx="7" fill="#dcefe6" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="605" y="232" font-size="11.5" font-weight="700" fill="#256448" text-anchor="middle">偏置方案：分数上加标量</text>

  <rect x="510" y="248" width="190" height="58" rx="8" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="522" y="268" font-size="12" font-weight="700" fill="#22333f">T5：可学习偏置 b(j-i)</text>
  <text x="522" y="285" font-size="10.5" fill="#5a504a">查表式标量，只看相对距离，</text>
  <text x="522" y="299" font-size="10.5" fill="#5a504a">不看内容；极简、效果强</text>

  <rect x="510" y="312" width="190" height="58" rx="8" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="522" y="332" font-size="12" font-weight="700" fill="#22333f">ALiBi：-λ|i-j| 免训练</text>
  <text x="522" y="349" font-size="10.5" fill="#5a504a">注意力分数减去线性距离惩罚，</text>
  <text x="522" y="363" font-size="10.5" fill="#5a504a">外推能力一流</text>

  <rect x="510" y="376" width="190" height="58" rx="8" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="522" y="396" font-size="12" font-weight="700" fill="#22333f">TUPE：解耦位置投影</text>
  <text x="522" y="413" font-size="10.5" fill="#5a504a">内容/位置各自独立投影，</text>
  <text x="522" y="427" font-size="10.5" fill="#5a504a">归一化系数 √(2d)</text>

  <!-- 上下文方案列 -->
  <rect x="716" y="212" width="194" height="30" rx="7" fill="#dcefe6" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="813" y="232" font-size="11.5" font-weight="700" fill="#256448" text-anchor="middle">上下文方案：织进 K/V 特征</text>

  <rect x="716" y="248" width="194" height="58" rx="8" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="728" y="268" font-size="12" font-weight="700" fill="#22333f">经典式（Shaw）</text>
  <text x="728" y="285" font-size="10.5" fill="#5a504a">可学习的相对嵌入 a(i-j)，</text>
  <text x="728" y="299" font-size="10.5" fill="#5a504a">裁剪窗口内查表</text>

  <rect x="716" y="312" width="194" height="58" rx="8" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="728" y="332" font-size="12" font-weight="700" fill="#22333f">Transformer-XL</text>
  <text x="728" y="349" font-size="10.5" fill="#5a504a">u、v 全局偏置 + 内容/位置</text>
  <text x="728" y="363" font-size="10.5" fill="#5a504a">投影拆分 W(k,E)/W(k,R)</text>

  <rect x="716" y="376" width="194" height="58" rx="8" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="728" y="396" font-size="12" font-weight="700" fill="#22333f">TENER · DeBERTa</text>
  <text x="728" y="413" font-size="10.5" fill="#5a504a">方向感知、去掉 √d 缩放；</text>
  <text x="728" y="427" font-size="10.5" fill="#5a504a">δ 相对距离分桶、内容与位置解耦</text>

  <!-- NoPE -->
  <polyline points="230,442 230,458" fill="none" stroke="#8a7f70" stroke-width="1.6" stroke-dasharray="5,4"/>
  <rect x="60" y="460" width="850" height="52" rx="10" fill="#f2ede4" stroke="#8a7f70" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="90" y="482" font-size="12.5" font-weight="700" fill="#22333f">NoPE（异端）：什么都不加</text>
  <text x="90" y="501" font-size="11" fill="#5a504a">因果注意力自带时序（第 i 个 token 只能看见前 i-1 个）——但位置分辨率随长度衰减约 1/√n，长文本会"糊"</text>

  <!-- 底注 -->
  <text x="90" y="532" font-size="11" fill="#7c6f64">阅读顺序：先学三角式（本笔记）→ 再看四项分解理解局限 → 最后按需取用 RPE 家族</text>
</svg>
